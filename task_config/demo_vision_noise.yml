# demo_vision_noise.yaml

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15

embodiment: [aloha-agilex]
language_num: 100

domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1.0
  random_head_camera_dis: 0.0
  random_table_height: 0.0
  random_light: false
  crazy_random_light_rate: 0.0

# ── New keys that base_task.py will now read ────────────────────────────────
apply_sensor_noise: true
sensor_noise_probability: 1.0           # 1.0 = every frame corrupted
sensor_noise_types:
  - motion
  - gaussian
  - zoom
  - fog
  - glass
# force_sensor_noise_type: motion        # optional — uncomment to always use glass
# sensor_noise_severity_min: 1
# sensor_noise_severity_max: 5

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true

data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false

pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

eval_mode: true
need_plan: true