# RoboTwin-Plus: Enhanced Object Perturbation (O1 + O2)
# Goes beyond original demo_randomized.yml / demo_objects.yml by adding:
#   O1+: Difficulty-scaled distractor count (3-15, not fixed 10)
#   O2:  Target object pose perturbation (position + rotation noise)
# Ref: LIBERO-Plus O1 (confounding objects) + O2 (target object pose)

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15

embodiment: [aloha-agilex]
language_num: 100

domain_randomization:
  # O1 base: cluttered table (same mechanism, enhanced count)
  cluttered_table: true
  clean_background_rate: 0.02

  # RoboTwin-Plus: enhanced object perturbations
  object_plus:
    enabled: true

    # O1+: Random number of distractors per episode
    distractor_min: 3                 # minimum distractors
    distractor_max: 15                # maximum distractors (original fixed at 10)

    # O2: Target object pose perturbation
    target_pose_perturbation:
      enabled: true
      position_std: 0.02              # Gaussian std in meters (~2cm x,y shift)
      rotation_max_deg: 15            # Max yaw rotation in degrees

  # All other perturbations OFF for clean ablation
  random_background: false
  random_head_camera_dis: 0.0
  random_table_height: 0.0
  random_light: false
  crazy_random_light_rate: 0.0
  apply_lighting_ablation: false
  apply_robot_init_random: false

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true

data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false

pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
