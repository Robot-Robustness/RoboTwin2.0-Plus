# RoboTwin 2.0-Plus: Enhanced Background Perturbation (B1 + B2)
# Goes beyond original demo_randomized.yml by adding:
#   B1+: Wall/floor color tinting (not just texture swap)
#   B2:  Table surface material randomization (metallic, roughness, color)
# Ref: LIBERO-Plus B1 (scene theme) + B2 (surface appearance)

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15

embodiment: [aloha-agilex]
language_num: 100

domain_randomization:
  # Original background texture swap (B1 baseline — kept ON)
  random_background: true
  clean_background_rate: 0.02

  # RoboTwin 2.0-Plus: enhanced background perturbations
  background_plus:
    enabled: true

    # B1+: Random color tint applied to wall and floor
    color_tint: true
    tint_range: [0.4, 1.8]           # RGB multiplier per channel (wider = harder)

    # B2: Table surface material randomization
    surface_material: true
    metallic_range: [0.0, 0.8]       # 0=matte plastic, 0.8=shiny metal
    roughness_range: [0.05, 0.95]    # 0.05=mirror-like, 0.95=rough stone

    # B1+: Floor gets random color too (not in original)
    floor_texture: true

  # All other perturbations OFF for clean ablation
  cluttered_table: false
  random_head_camera_dis: 0.0
  random_table_height: 0.0
  random_light: false
  crazy_random_light_rate: 0.0
  apply_lighting_ablation: false
  apply_robot_init_random: false

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true

data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false

pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
