# RoboTwin-Plus: Language Perturbation — R2 Only (Common Sense Rewording)
# Isolates R2: object names replaced with functional descriptions, verb synonyms
# Uses pre-generated variants from task_instruction_plus/*.json
# Ref: LIBERO-Plus R2 common sense rewording

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15

embodiment: [aloha-agilex]
language_num: 100

language:
  mode: r2

domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1.0
  random_head_camera_dis: 0.0
  random_table_height: 0.0
  random_light: false
  crazy_random_light_rate: 0.0
  apply_lighting_ablation: false
  apply_robot_init_random: false

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true

data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false

pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true

eval_mode: true
need_plan: true
