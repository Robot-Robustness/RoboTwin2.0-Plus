# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  # ── Lighting ablation (the only active perturbation) ─────────────────────────
  apply_lighting_ablation: false           # Enables cycling through L1–L4 modes
  crazy_random_light_rate: 0.0            # Disable per-frame flicker for clean ablation
  apply_robot_init_random: false          # main switch (true/false)
  robot_init:
    enabled: true                        # redundant but consistent with camera style
    joint_std: 0.2                       # Gaussian std in radians (~11.5° per joint)
    max_clip_rad: 0.45                    # max deviation from home per joint (~25.8°)
    gripper_extreme_prob: 0.25            # probability to set gripper to extreme (0.05 or 0.95)
    apply_to_both_arms: true             # randomize both left & right
  # All other randomizations turned off for pure lighting isolation
  random_background: false
  cluttered_table: false
  clean_background_rate: 1.0
  random_head_camera_dis: 0.0
  random_table_height: 0.0
  random_light: false                     # Legacy flag — not needed when cycling is on
  random_embodiment: false
language:
  mode: r1           # or unseen, r1_distraction
  r1_distraction_prob: 0.5

camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
